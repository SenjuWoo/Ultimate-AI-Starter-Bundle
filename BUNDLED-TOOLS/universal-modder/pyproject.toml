[project]
name = "universal-modder"
version = "0.2.0"
description = "Tools and a shared knowledge base for AI agents that mod games: engine scanner, fal asset generation, sprite and 3D-to-sprite pipelines, window capture and input on Windows, showcase video editing, field notes."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "pillow==12.3.0",
    "numpy==2.5.3",
    "pyyaml==6.0.3",
]

[project.scripts]
um = "um.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["um"]

[tool.hatch.build.targets.wheel.force-include]
"knowledge" = "um/knowledge"
