# UABS toolbox: one always-on MCP server that starts the switched-off project
# tools on demand. Built into BUNDLED-TOOLS/offline as a wheel and installed
# with `uv tool install` like the other bundle-owned Python tools.
[project]
name = "uabs-toolbox"
version = "1.0.3"
description = "One small MCP server that finds and starts the project tools a chat does not load, on demand."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "mcp==1.30.0",
]

[project.scripts]
uabs-toolbox = "uabs_toolbox.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["uabs_toolbox"]
