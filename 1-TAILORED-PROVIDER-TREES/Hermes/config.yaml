# Portable Hermes starter config. Ships provider/model preferences only;
# MCP servers and hooks are wired per-machine by INSTALL-AIO.ps1.
model:
  default: particle-ai/particle-1
  provider: openrouter
  base_url: https://openrouter.ai/api/v1
  aliases:
    # Escalation ladder. Every id verified against openrouter.ai/api/v1/models;
    # none is written from memory. Switch with `hermes model <alias>`.
    nemotron-ultra: openrouter/nvidia/nemotron-3-ultra-550b-a55b:free
    nemotron-ultra-nofree: openrouter/nvidia/nemotron-3-ultra-550b-a55b
    v4.1-flash: openrouter/deepseek/deepseek-v4.1-flash
    flash: openrouter/deepseek/deepseek-v4-flash-0731
    muse: openrouter/meta/muse-spark-1.2-contributor
    v4-pro: openrouter/deepseek/deepseek-v4-pro-0813
    gemini-flash: openrouter/google/gemini-3.7-flash
    glm: openrouter/z-ai/glm-5.3
    grok: openrouter/x-ai/grok-4.6
    sol: openrouter/openai/gpt-5.6-sol
    opus: openrouter/anthropic/claude-opus-5
# No automatic failover. The old free chain (laguna/inkling) was text-only or
# weaker than the main model, so a failover silently downgraded answers and
# dropped images. Add your own entries here if you want failover; they must
# accept the same modalities as the main model or the task changes shape.
fallback_providers: []
database:
  journal_mode: wal
runtime:
  nofile_soft_limit: 4096
agent:
  # Unlimited turns: large one-shot jobs must never be amputated mid-task.
  max_turns: null
  api_max_retries: 2
  empty_response_guard:
    enabled: true
    cost_threshold_usd: 0.01
  tool_use_enforcement: true
  execution_guidance: true
  intent_ack_continuation: true
  stall_guards: true
  task_completion_guidance: true
  parallel_tool_call_guidance: true
  environment_probe: true
  coding_context: auto
  verify_guidance: true
  max_verify_nudges: 3
  verify_on_stop: true
  verbose: false
  reasoning_effort: high
  personalities: {}
terminal:
  backend: local
  cwd: .
  timeout: 600
  home_mode: auto
  container_cpu: 1
  container_memory: 5120
  container_disk: 51200
  container_persistent: true
  docker_mount_cwd_to_workspace: false
  lifetime_seconds: 300
browser:
  inactivity_timeout: 120
  allow_private_urls: true
file_read_max_chars: 80000
mcp:
  auto_reload_on_config_change: false
tool_output:
  max_bytes: 30000
  max_lines: 1500
  max_line_length: 2000
tool_loop_guardrails:
  warnings_enabled: true
  hard_stop_enabled: true
  warn_after:
    exact_failure: 2
    same_tool_failure: 3
    idempotent_no_progress: 2
  hard_stop_after:
    exact_failure: 5
    same_tool_failure: 8
    idempotent_no_progress: 5
compression:
  enabled: true
  progress_notices: true
  threshold: 0.50
  threshold_tokens: 320000
  target_ratio: 0.20
  tail_mode: lean
  protect_last_n: 20
  min_tail_user_messages: 3
  max_attempts: 4
  proactive_prune_tokens: 80000
  proactive_prune_min_result_chars: 12000
  proactive_prune_min_reclaim_tokens: 32768
  micro_compact: false
  protect_first_n: 3
  abort_on_summary_failure: true
  codex_gpt55_autoraise: true
  codex_app_server_auto: native
  codex_responses_native: false
  codex_responses_compact_threshold: 200000
  in_place: true
  idle_compact_after_seconds: 0
prompt_caching:
  cache_ttl: 1h
openrouter:
  response_cache: false
  response_cache_ttl: 300
  min_coding_score: 0.65
auxiliary:
  # Low-cost pair: DeepSeek for vision/reasoning/review; Particle for repeatable ops.
  transient_retries: 2
  vision:
    provider: openrouter
    model: deepseek/deepseek-v4.1-flash-1017
    timeout: 120
    extra_body: {}
    reasoning_effort: high
    download_timeout: 30
  compression:
    provider: openrouter
    model: deepseek/deepseek-v4.1-flash-1017
    timeout: 120
    extra_body: {}
    reasoning_effort: medium
    no_progress_timeout:
  skills_hub:
    provider: openrouter
    model: particle-ai/particle-1
    timeout: 30
    extra_body: {}
    reasoning_effort: medium
  approval:
    provider: openrouter
    model: deepseek/deepseek-v4.1-flash-1017
    timeout: 30
    extra_body: {}
    reasoning_effort: medium
  review:
    provider: openrouter
    model: deepseek/deepseek-v4.1-flash-1017
    api_mode: ''
    reasoning_effort: high
  mcp:
    provider: openrouter
    model: particle-ai/particle-1
    timeout: 30
    extra_body: {}
    reasoning_effort: medium
  title_generation:
    enabled: true
    model_upgrade_enabled: true
    provider: openrouter
    model: particle-ai/particle-1
    prefer_fast_model: false
    timeout: 30
    extra_body: {}
    reasoning_effort: minimal
    language: ''
  memory_query_rewrite:
    provider: openrouter
    model: deepseek/deepseek-v4.1-flash-1017
    timeout: 8
    extra_body: {}
    reasoning_effort: minimal
  tts_audio_tags:
    provider: openrouter
    model: deepseek/deepseek-v4.1-flash-1017
    timeout: 30
    extra_body: {}
    reasoning_effort: minimal
  voice_chat:
    provider: openrouter
    model: particle-ai/particle-1
    timeout: 120
    extra_body: {}
    reasoning_effort: low
  triage_specifier:
    provider: openrouter
    model: deepseek/deepseek-v4.1-flash-1017
    timeout: 120
    extra_body: {}
    reasoning_effort: high
  kanban_decomposer:
    provider: openrouter
    model: deepseek/deepseek-v4.1-flash-1017
    timeout: 180
    extra_body: {}
    reasoning_effort: high
  profile_describer:
    provider: openrouter
    model: particle-ai/particle-1
    timeout: 60
    extra_body: {}
    reasoning_effort: low
  goal_judge:
    provider: openrouter
    model: deepseek/deepseek-v4.1-flash-1017
    timeout: 60
    extra_body: {}
    reasoning_effort: medium
  curator:
    provider: openrouter
    model: deepseek/deepseek-v4.1-flash-1017
    timeout: 600
    extra_body: {}
    reasoning_effort: high
  monitor:
    provider: openrouter
    model: deepseek/deepseek-v4.1-flash-1017
    timeout: 60
    extra_body: {}
    reasoning_effort: medium
  background_review:
    enabled: true
    provider: openrouter
    model: deepseek/deepseek-v4.1-flash-1017
    timeout: 120
    extra_body: {}
    reasoning_effort: high
  moa_reference:
    provider: openrouter
    model: deepseek/deepseek-v4.1-flash-1017
    timeout: 900
    extra_body: {}
  moa_aggregator:
    provider: openrouter
    model: particle-ai/particle-1
    timeout: 900
    extra_body: {}
display:
  compact: false
  personality: ''
  busy_input_mode: interrupt
  bell_on_complete: false
  show_reasoning: true
  background_process_notifications: concise
  streaming: true
  skin: default
  interim_assistant_messages: true
  tool_progress: all
  cleanup_progress: false
  long_running_notifications: true
  busy_ack_detail: true
stt:
  enabled: true
  language: en
  local:
    model: base
  openai:
    model: whisper-1
    language: ''
memory:
  memory_enabled: true
  user_profile_enabled: true
  memory_char_limit: 6000
  user_char_limit: 2000
  nudge_interval: 10
  flush_min_turns: 6
delegation:
  # Cheap model map: Particle for Fast/execute; DeepSeek V4.1 Flash for research.
  max_iterations: 100
  backend: model_map
  backends:
    model_map:
      options:
      - name: Fast
        description: Quick independent tasks, simple code changes, summaries, formatting, and straightforward tool operations. Prioritize speed and low token usage.
        provider: openrouter
        model: particle-ai/particle-1
        reasoning_effort: low
      - name: execute
        description: Implement features, write and refactor code, run tests, and fix well-understood bugs. Follow existing plans and verify the results.
        provider: openrouter
        model: particle-ai/particle-1
        reasoning_effort: high
      - name: research
        description: Investigate complex bugs, research unfamiliar systems, compare technical approaches, and design architectures. Return evidence and actionable plans.
        provider: openrouter
        model: deepseek/deepseek-v4.1-flash-1017
        reasoning_effort: xhigh
      default: execute
  model: ''
  provider: ''
  reasoning_effort: high
  max_concurrent_children: 3
  max_spawn_depth: 1
  orchestrator_enabled: true
  inherit_mcp_toolsets: true
  max_summary_chars: 24000
  child_timeout_seconds: 0
  oneshot_max_children: 2
  subagent_auto_approve: false
  surface_child_process_notifications: false
moa:
  # Cheap MoA: DeepSeek V4.1 Flash reference, Particle aggregator; premium preset disabled.
  presets:
    default:
      reference_models:
      - provider: openrouter
        model: deepseek/deepseek-v4.1-flash-1017
        enabled: false
      aggregator:
        provider: openrouter
        model: particle-ai/particle-1
      enabled: false
      degraded_reference_policy: loud
      fanout: user_turn
    deepseek_particle:
      enabled: true
      reference_models:
      - provider: openrouter
        model: deepseek/deepseek-v4.1-flash-1017
        enabled: true
      aggregator:
        provider: openrouter
        model: particle-ai/particle-1
      degraded_reference_policy: loud
      fanout: user_turn
  reference_models:
  - provider: openrouter
    model: deepseek/deepseek-v4.1-flash-1017
    enabled: true
  aggregator:
    provider: openrouter
    model: particle-ai/particle-1
  degraded_reference_policy: loud
  max_tokens: 4096
  fanout: user_turn
  enabled: true
  default_preset: deepseek_particle
  active_preset: ''
  save_traces: false
  trace_dir: ''
  privacy_filter: ''
skills:
  creation_nudge_interval: 0
security:
  allow_private_urls: true
kanban:
  review_dispatch: true
code_execution:
  timeout: 600
  max_tool_calls: 100
telemetry:
  shared_metrics:
    enabled: false
updates:
  pre_update_backup: true
  backup_keep: 5
  non_interactive_local_changes: stash
_config_version: 44
provider_routing:
  sort: price
  require_parameters: true
session_reset:
  mode: none
  idle_minutes: 1440
  at_hour: 4
group_sessions_per_user: true
mcp_servers: {}
plugins:
  enabled:
  - ponytail
  - superpowers/.hermes-plugin
  disabled:
  - web/brave_free
  - rtk-rewrite
  entries:
    ponytail:
      allow_tool_override: false

# -- Security ----------------------------------------------------------
# Secret redaction is ON by default -- strings that look like API keys,
# tokens, and passwords are masked in tool output, logs, and chat
# responses before the model or user ever sees them. Set redact_secrets
# to false to disable (e.g. when developing the redactor itself).
# tirith pre-exec scanning is enabled by default when the tirith binary
# is available. Configure via security.tirith_* keys or env vars
# (TIRITH_ENABLED, TIRITH_BIN, TIRITH_TIMEOUT, TIRITH_FAIL_OPEN).
#
# security:
#   redact_secrets: true
#   tirith_enabled: true
#   tirith_path: "tirith"
#   tirith_timeout: 5
#   tirith_fail_open: true

# -- Fallback Model ----------------------------------------------------
# Automatic provider failover when primary is unavailable.
# Uncomment and configure to enable. Triggers on rate limits (429),
# overload (529), service errors (503), or connection failures.
#
# Supported providers:
#   openrouter   (OPENROUTER_API_KEY)  -- routes to any model
#   openai-codex (OAuth -- hermes auth) -- OpenAI Codex
#   nous         (OAuth -- hermes auth) -- Nous Portal
#   zai          (ZAI_API_KEY)         -- Z.AI / GLM
#   kimi-coding  (KIMI_API_KEY)        -- Kimi / Moonshot
#   kimi-coding-cn (KIMI_CN_API_KEY)   -- Kimi / Moonshot (China)
#   minimax      (MINIMAX_API_KEY)     -- MiniMax
#   minimax-cn   (MINIMAX_CN_API_KEY)  -- MiniMax (China)
#   bedrock      (AWS IAM / boto3)     -- AWS Bedrock (Converse API)
#
# For custom OpenAI-compatible endpoints, add base_url and key_env.
#
# fallback_model:
#   provider: openrouter
#   model: anthropic/claude-sonnet-4
