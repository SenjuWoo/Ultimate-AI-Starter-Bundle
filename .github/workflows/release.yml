name: Release

# Publishes the bundle with no human step once CI is green on main.
# A VERSION.txt bump that reaches main IS the release request; a main commit
# whose version already has a tag (docs or handoff pushes) publishes nothing.
# Fail-closed order: exact SHA is still main -> every other check on that SHA
# finished successful -> latest companions fetched and verified -> two builds
# byte-identical -> provenance and build attestation -> publish -> re-download
# and compare every asset. A published release is never deleted or replaced here.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Publish release
    # No job-level `if`: GitHub files a workflow_run run under main's newest commit,
    # so a skipped run (CI cancelled by a newer push) made that commit's exact-SHA
    # verdict read "fail". The decide step turns a non-green trigger into a no-op.
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      SHA: ${{ github.event.workflow_run.head_sha }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Decide whether this SHA is a release
        id: decide
        env:
          CI_GREEN: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' }}
        run: |
          set -euo pipefail
          if [ "$CI_GREEN" != "true" ]; then echo "CI on $SHA did not pass on a push: nothing to publish"; echo "publish=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          test "$(git rev-parse HEAD)" = "$SHA"
          version=$(python -c "print(open('VERSION.txt',encoding='utf-8-sig').read().strip().lstrip('vV'))")
          tag="v$version"
          main=$(gh api "repos/$REPO/commits/main" --jq .sha)
          # A newer main commit gets its own CI and its own release decision.
          if [ "$main" != "$SHA" ]; then echo "main is $main, not $SHA: skip"; echo "publish=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          # ls-remote fails the job on a network error instead of reading it as "no tag".
          tag_sha="$(git ls-remote --tags origin "refs/tags/$tag" | awk 'NR==1{print $1}')"
          if [ -n "$tag_sha" ]; then
            # The tag is immutable: never retarget it. Two cases are legitimate and
            # must not paint main red:
            #   1. main moved past the released version (documentation commits) - the
            #      version in VERSION.txt was released from an earlier commit.
            #   2. the tag was cut by hand at another commit and VERSION.txt still
            #      names it - still a human decision, but not a failed build.
            # Anything else (a bump that collides with an existing tag) stays a hard
            # stop so nobody silently ships different bytes under a published tag.
            if [ "$tag_sha" != "$SHA" ]; then
              if gh release view "$tag" --repo "$REPO" >/dev/null 2>&1; then
                echo "$tag is already published from $tag_sha; this commit only carries later work."
                echo "publish=false" >> "$GITHUB_OUTPUT"; exit 0
              fi
              echo "::error::$tag already points at $tag_sha, not $SHA - refusing to retarget a published tag"
              exit 1
            fi
            # Same commit: a previous run may have failed after publishing. Do not
            # rebuild (companion resolution is 'latest' and would differ); verify
            # the bytes that are already published.
            if gh release view "$tag" --repo "$REPO" >/dev/null 2>&1; then
              echo "$tag already published at this SHA: verifying the published assets"
              echo "publish=true" >> "$GITHUB_OUTPUT"; echo "mode=verify" >> "$GITHUB_OUTPUT"
              echo "tag=$tag" >> "$GITHUB_OUTPUT"; echo "version=$version" >> "$GITHUB_OUTPUT"
              echo "commit_time=$(git show -s --format=%cI HEAD)" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::error::$tag exists at this SHA but has no release; publishing it is a manual decision"
            exit 1
          fi
          test -f "docs/history/V$version-CHANGELOG.md"
          { echo "publish=true"; echo "mode=publish"; echo "tag=$tag"; echo "version=$version"; echo "commit_time=$(git show -s --format=%cI HEAD)"; } >> "$GITHUB_OUTPUT"

      - name: Wait for every other check on this SHA
        if: steps.decide.outputs.publish == 'true'
        run: |
          python - <<'EOF'
          import json, os, subprocess, sys, time
          repo, sha = os.environ["REPO"], os.environ["SHA"]
          def api(path):
              return json.loads(subprocess.run(["gh", "api", path], check=True, capture_output=True, text=True).stdout)
          deadline = time.monotonic() + 3600
          while True:
              runs = [r for r in api(f"repos/{repo}/commits/{sha}/check-runs?per_page=100")["check_runs"] if r["name"] != "Publish release"]
              status = api(f"repos/{repo}/commits/{sha}/status")
              bad = [r["name"] for r in runs if r["status"] == "completed" and r["conclusion"] != "success"]
              bad += [s["context"] for s in status["statuses"] if s["state"] in ("failure", "error")]
              if bad:
                  sys.exit("failed checks on %s: %s" % (sha, ", ".join(bad)))
              waiting = [r["name"] for r in runs if r["status"] != "completed"]
              waiting += [s["context"] for s in status["statuses"] if s["state"] == "pending"]
              if runs and not waiting:
                  print("all %d check runs and %d statuses passed on %s" % (len(runs), len(status["statuses"]), sha))
                  observed = {"checks": sorted(({"name": r["name"], "conclusion": r["conclusion"], "url": r["html_url"]} for r in runs), key=lambda r: r["name"]),
                              "statuses": sorted(({"context": s["context"], "state": s["state"]} for s in status["statuses"]), key=lambda s: s["context"])}
                  with open(os.path.join(os.environ["RUNNER_TEMP"], "checks.json"), "w", encoding="utf-8") as fh:
                      json.dump(observed, fh, indent=2)
                  break
              if time.monotonic() > deadline:
                  sys.exit("still pending after 60 min: %s" % (", ".join(waiting) or "no checks reported"))
              time.sleep(30)
          EOF

      - name: Fetch and verify the latest companion releases
        if: steps.decide.outputs.publish == 'true' && steps.decide.outputs.mode == 'publish'
        shell: powershell
        run: |
          # In-process: the script throws on any failure, which fails the step.
          .\TOOLS\Get-Companions.ps1

      - name: Build twice and require identical bytes
        if: steps.decide.outputs.publish == 'true' && steps.decide.outputs.mode == 'publish'
        run: |
          set -euo pipefail
          python TOOLS/build_release.py --root . --outdir "$RUNNER_TEMP/build-a" --require-companions
          python TOOLS/build_release.py --root . --outdir "$RUNNER_TEMP/build-b" --require-companions
          ls "$RUNNER_TEMP/build-a" | sort > a.txt; ls "$RUNNER_TEMP/build-b" | sort > b.txt; cmp a.txt b.txt
          test "$(wc -l < a.txt)" -eq 4
          while read -r f; do cmp "$RUNNER_TEMP/build-a/$f" "$RUNNER_TEMP/build-b/$f"; done < a.txt
          (cd "$RUNNER_TEMP/build-a" && sha256sum *.zip)

      - name: Write provenance (receipt, SBOM, observed checks, checksums)
        if: steps.decide.outputs.publish == 'true' && steps.decide.outputs.mode == 'publish'
        run: |
          set -euo pipefail
          python TOOLS/release_provenance.py --dist "$RUNNER_TEMP/build-a" --checks "$RUNNER_TEMP/checks.json" \
            --commit "$SHA" --commit-time "${{ steps.decide.outputs.commit_time }}" --repo "$REPO"
          test "$(ls "$RUNNER_TEMP/build-a" | wc -l)" -eq 9

      - name: Attest the build
        if: steps.decide.outputs.publish == 'true' && steps.decide.outputs.mode == 'publish'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/build-a/*.zip

      - name: Publish and verify the published bytes
        if: steps.decide.outputs.publish == 'true'
        env:
          TAG: ${{ steps.decide.outputs.tag }}
          VERSION: ${{ steps.decide.outputs.version }}
        run: |
          set -euo pipefail
          if [ "${{ steps.decide.outputs.mode }}" = "verify" ]; then
            # Re-run of a published release: the bytes are immutable, so only
            # re-download and compare. No rebuild, no re-attest, no replacement.
            rm -rf "$RUNNER_TEMP/published"
            gh release download "$TAG" --repo "$REPO" --dir "$RUNNER_TEMP/published"
            (cd "$RUNNER_TEMP/published" && sha256sum -c SHA256SUMS.txt)
            echo "verified the published bytes of $TAG at $SHA"
            exit 0
          fi
          # A new user lands here first: say which file to take before the changelog.
          { 
            echo "**Which file?** Most people: \`Ultimate-AI-Starter-Bundle-$TAG-Full-Offline.zip\` (everything in one file). Smaller download: \`Ultimate-AI-Starter-Bundle-$TAG-Core.zip\` (the installer fetches the rest). Unzip it, double-click \`START-HERE.bat\`, then reopen your AI apps. The other files are checksums and build records for verifying the zip."
            echo
            tail -n +2 "docs/history/V$VERSION-CHANGELOG.md"
          } > "$RUNNER_TEMP/notes.md"
          # Re-running after a failed verification must be possible without ever
          # retargeting a tag. An existing release is reused only when it already
          # points at this exact SHA; anything else is a hard stop for a human.
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            existing="$(gh api "repos/$REPO/commits/$TAG" --jq .sha)"
            if [ "$existing" != "$SHA" ]; then
              echo "::error::release $TAG already exists at $existing, not $SHA - refusing to retarget it"
              exit 1
            fi
            echo "release $TAG already published at this SHA; re-verifying the published bytes"
          else
            gh release create "$TAG" --repo "$REPO" --target "$SHA" --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md" --latest "$RUNNER_TEMP"/build-a/*
          fi
          test "$(gh api "repos/$REPO/commits/$TAG" --jq .sha)" = "$SHA"
          rm -rf "$RUNNER_TEMP/published"
          gh release download "$TAG" --repo "$REPO" --dir "$RUNNER_TEMP/published"
          test "$(ls "$RUNNER_TEMP/published" | wc -l)" -eq "$(ls "$RUNNER_TEMP/build-a" | wc -l)"
          for f in "$RUNNER_TEMP"/build-a/*; do cmp "$f" "$RUNNER_TEMP/published/$(basename "$f")"; done
          (cd "$RUNNER_TEMP/published" && sha256sum -c SHA256SUMS.txt)
          echo "published $TAG at $SHA; every downloaded asset equals the build"
