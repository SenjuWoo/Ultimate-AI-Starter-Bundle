name: CI

# Two products, one repository.
#
# The PACK jobs target Windows PowerShell 5.1 specifically: its encoding
# defaults, its BOM behaviour and its native-stderr handling are the source of
# most bugs this repo has shipped. Running that gate anywhere else would test a
# different language, so those jobs are windows-latest and use
# `shell: powershell` (Windows PowerShell 5.1), never `pwsh` (PowerShell 7+).
#
# Skyrim Forge lives in github.com/SenjuWoo/SkyrimForge again, with its own
# matrix. This repo pins one Forge release and proves, end to end, that the
# bundle installer installs exactly that release and that it runs.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hermes-yaml:
    name: Hermes YAML and physical symlink preservation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - run: python -m pip install --disable-pip-version-check PyYAML==6.0.3 ruamel.yaml==0.18.16
      - run: python TOOLS/hooks/hermes_wire.py --selftest

  pack-gate:
    name: Pack gate (Windows PowerShell 5.1, Python ${{ matrix.python }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.14", "3.15"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}

      - name: PowerShell edition in use
        shell: powershell
        run: |
          $PSVersionTable.PSVersion.ToString()
          if ($PSVersionTable.PSEdition -ne 'Desktop') {
            throw "Expected Windows PowerShell (Desktop edition); got $($PSVersionTable.PSEdition)."
          }

      - name: Toolbox gate dependency (the MCP SDK version the wheel pins)
        shell: powershell
        run: |
          python -m pip install --disable-pip-version-check mcp==1.30.0 PyYAML==6.0.3 ruamel.yaml==0.18.16
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Pack gate
        shell: powershell
        run: |
          .\TESTS\Test-Pack.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Release contracts
        shell: powershell
        run: |
          python TESTS/test_workspace_ownership.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python TESTS/test_product_delivery.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python TESTS/test_release_contract.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python TESTS/test_shared_shell.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python TESTS/test_hermes_bootstrap.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python TESTS/test_privacy_boundary.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Deterministic Core artifact and extracted pack gate
        shell: powershell
        run: |
          python TOOLS/build_release.py --root . --outdir artifacts --core-only
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $prefix = 'Ultimate-AI-Starter-Bundle-' + ([IO.File]::ReadAllText('VERSION.txt').Trim())
          $extract = Join-Path $PWD 'artifacts\extracted-core'
          python -m zipfile -e (Join-Path $PWD "artifacts\$prefix-Core.zip") $extract
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $coreRoot = Join-Path $extract $prefix
          python (Join-Path $coreRoot 'TOOLS\verify_product.py')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  manifest:
    name: MANIFEST verifies against the tree
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      # Byte fidelity is the point of this repo: .gitattributes sets `* -text`
      # so a clone is identical to the released pack. If checkout ever starts
      # normalising line endings, every hash here changes and this job says so.
      - name: Verify every recorded hash
        shell: powershell
        run: python .github/scripts/verify_manifest.py

  version-consistency:
    name: Version strings agree
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Check declared versions
        shell: powershell
        run: python .github/scripts/check_versions.py

  # Skyrim Forge is developed and released in github.com/SenjuWoo/SkyrimForge,
  # which runs Forge's own matrix (Python, native Go writer, reproducible
  # repository gate, Windows installer). This repo pins one release by tag,
  # asset and SHA-256. Two repositories are how 7.8.0 shipped an installer that
  # read a contract field Forge never emitted, so this job installs the exact
  # pinned release with the real installer on a clean machine, runs
  # `forge doctor`, and proves an upgrade keeps the user's Workspaces.
  forge-bundle-install:
    name: Bundle installs pinned Forge end to end
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Install the pinned Forge release exactly as the AIO does
        shell: powershell
        run: |
          $utf8NoBom = New-Object System.Text.UTF8Encoding($false)
          [IO.File]::AppendAllText($env:GITHUB_ENV, "SKYRIM_FORGE_PYTHON=${{ steps.python.outputs.python-path }}`n", $utf8NoBom)
          $env:SKYRIM_FORGE_PYTHON = '${{ steps.python.outputs.python-path }}'
          $root = Join-Path $env:RUNNER_TEMP 'Skyrim Tools\Skyrim-Forge'
          .\TOOLS\Install-SkyrimForge.ps1 -ForgeRoot $root -Providers Claude
          if ($LASTEXITCODE -ne 0) { throw "Install-SkyrimForge.ps1 exited $LASTEXITCODE" }
          $pin = (Get-Content -Raw BUNDLED-TOOLS\CATALOG.json | ConvertFrom-Json).components | Where-Object { $_.id -eq 'skyrim-forge' }
          $target = [IO.File]::ReadAllText((Join-Path $root 'VERSION.txt'))
          if ($target -notmatch ('(?m)^Skyrim Forge\s+' + [regex]::Escape($pin.version) + '\s*$')) { throw "Installed '$target'; CATALOG pins $($pin.version)" }
          Write-Host "installed $($pin.version) -> $root"

      # Job staging defaults to <install root>\Workspaces, and the installer
      # replaces the install directory to upgrade it. Before 7.9.1 that deleted
      # the user's mod work on every version change. Downgrade VERSION.txt to
      # force a real re-stage, leave a marker in Workspaces, and prove it is
      # still there afterwards.
      - name: An upgrade must not delete the user's Workspaces
        shell: powershell
        run: |
          $env:SKYRIM_FORGE_PYTHON = '${{ steps.python.outputs.python-path }}'
          $root = Join-Path $env:RUNNER_TEMP 'Skyrim Tools\Skyrim-Forge'
          $utf8NoBom = New-Object System.Text.UTF8Encoding($false)
          New-Item -ItemType Directory -Force -Path (Join-Path $root 'Workspaces\MyMod') | Out-Null
          [IO.File]::WriteAllText((Join-Path $root 'Workspaces\MyMod\keep-me.txt'), 'user data', $utf8NoBom)
          [IO.File]::WriteAllText((Join-Path $root 'VERSION.txt'), "Skyrim Forge 0.0.1`n", $utf8NoBom)
          .\TOOLS\Install-SkyrimForge.ps1 -ForgeRoot $root -Providers Claude
          if ($LASTEXITCODE -ne 0) { throw "re-install exited $LASTEXITCODE" }
          $marker = Join-Path $root 'Workspaces\MyMod\keep-me.txt'
          if (-not (Test-Path -LiteralPath $marker -PathType Leaf)) { throw 'The upgrade deleted the user Workspaces.' }
          if ([IO.File]::ReadAllText($marker) -ne 'user data') { throw 'The upgrade corrupted the user Workspaces.' }
          $pin = (Get-Content -Raw BUNDLED-TOOLS\CATALOG.json | ConvertFrom-Json).components | Where-Object { $_.id -eq 'skyrim-forge' }
          $after = [IO.File]::ReadAllText((Join-Path $root 'VERSION.txt'))
          if ($after -notmatch ('(?m)^Skyrim Forge\s+' + [regex]::Escape($pin.version) + '\s*$')) { throw "Downgraded install was not re-staged: '$after'" }
          Write-Host "re-staged $($pin.version), Workspaces intact"

      # A tampered archive must stop the install before anything is extracted.
      - name: A digest mismatch is refused
        shell: powershell
        run: |
          $bad = Join-Path $env:RUNNER_TEMP 'tampered.zip'
          Copy-Item BUNDLED-TOOLS\offline\Skyrim-Forge-*.zip $bad
          [IO.File]::AppendAllText($bad, 'x')
          $root = Join-Path $env:RUNNER_TEMP 'Tampered\Skyrim-Forge'
          $ErrorActionPreference = 'Continue'
          $out = & powershell -NoProfile -ExecutionPolicy Bypass -File .\TOOLS\Install-SkyrimForge.ps1 -ForgeRoot $root -Providers Claude -SourceZip $bad 2>&1 | Out-String
          $code = $LASTEXITCODE
          Write-Host $out
          if ($code -eq 0) { throw 'A tampered archive was installed.' }
          if ($out -notmatch 'does not match the pinned release') { throw 'The digest refusal was not reported.' }
          if (Test-Path -LiteralPath (Join-Path $root 'VERSION.txt')) { throw 'Files were installed from a tampered archive.' }
          exit 0
